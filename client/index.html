<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#FBE8C0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1B1511" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>SpotS — Discover Patna</title>
    <meta
      name="description"
      content="SpotS is a hand-picked guide to Patna: cafés, heritage sites, parks, ghats, bazaars and hidden gems, ranked by the people who live here."
    />
    <meta property="og:site_name" content="SpotS" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SpotS — Discover Patna" />
    <meta
      property="og:description"
      content="A hand-picked guide to Patna: cafés, heritage sites, parks, ghats, bazaars and hidden gems."
    />

    <script>
      // Apply the saved theme before first paint to avoid a light flash. Key must match ThemeContext.
      try {
        if (localStorage.getItem('spots-theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (_) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,500;1,600&family=Poppins:wght@300;400;500;600;700;800&family=Rozha+One&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
